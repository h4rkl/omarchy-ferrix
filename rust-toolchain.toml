[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
# Keep the GNU target for the generic QEMU/CI contract and add the musl target
# used by the physical Pixel 9a product. The board workflow still validates the
# musl standard library and linker separately before any native build.
targets = ["aarch64-unknown-linux-gnu", "aarch64-unknown-linux-musl"]
