[workspace]
members = [
    "crates/ferrix-app-api",
    "crates/ferrix-app-protocol",
    "crates/ferrix-app-runtime-api",
    "crates/ferrix-appd",
    "crates/ferrix-terminal",
    "crates/ferrix-ui",
    "crates/ferrix-hardware-api",
    "crates/ferrix-hardware-emulator",
    "crates/ferrix-basic-screen",
    "crates/ferrix-core",
    "crates/ferrix-protocol",
    "crates/ferrix-session",
    "crates/ferrix-shell",
    "crates/ferrix-runtime-native",
    "crates/ferrix-target-profile",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
