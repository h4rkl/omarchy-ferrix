[workspace]
members = [
    "crates/app-api",
    "crates/app-protocol",
    "crates/app-runtime-api",
    "crates/appd",
    "crates/ferrum-terminal",
    "crates/ferrum-ui",
    "crates/hardware-api",
    "crates/hardware-emulator",
    "crates/mobile-basic-screen",
    "crates/mobile-core",
    "crates/mobile-protocol",
    "crates/mobile-session",
    "crates/mobile-shell",
    "crates/runtime-native",
    "crates/target-profile",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"
