schema_version = 1
name = "sim-absent"
description = "No SIM: the service reports sim absent, registration drops to unknown with zero signal, and a dial fails with no-sim."

[[step]]
service = "telephony"
command = { cmd = "set-radio", power = "on" }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-signal", bars = 3 }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "absent" }
expect = [ { event = "telephony-event", kind = "sim-changed", sim = { state = "absent" } }, { event = "telephony-event", kind = "registration-changed", registration = { state = "unknown" }, access = "none" }, { event = "telephony-event", kind = "signal-changed", signal = { bars = 0 } } ]
note = "the daemon derives registration loss and zero signal from the missing SIM"

[[step]]
service = "telephony"
command = { cmd = "dial", number = "+15550100002" }
expect_ack_error = true
note = "client verb; rejected with no-sim"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
expect = [ { event = "telephony-event", kind = "sim-changed", sim = { state = "ready" } } ]
note = "teardown"
