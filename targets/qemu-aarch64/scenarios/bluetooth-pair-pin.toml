schema_version = 1
name = "bluetooth-pair-pin"
description = "Legacy PIN pairing with the synthetic legacy headset: the request-pin prompt refuses a plain accept and a malformed PIN, a wrong PIN is rejected by the remote on the mock clock, and the profile PIN bonds. Records carry the stage only, never the PIN."

[[step]]
service = "core"
command = { cmd = "set-bluetooth", present = true }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "core"
command = { cmd = "set-bluetooth-pairing-outcome" }
note = "setup"

[[step]]
service = "core"
command = { cmd = "bluetooth-cancel" }
note = "setup"

[[step]]
service = "core"
command = { cmd = "bluetooth-discovery", active = true }
expect = [ { event = "bluetooth-session-changed", discovering = true } ]

[[step]]
service = "core"
command = { cmd = "bluetooth-pair", device = "mock-bt-found-4" }
expect = [ { event = "bluetooth-session-changed", discovering = false, pairing = { stage = "request-pin" } } ]
note = "legacy pairing asks for the remote's PIN"

[[step]]
service = "core"
command = { cmd = "bluetooth-reply", accept = true }
expect_ack_error = true
note = "a PIN request is answered with a PIN, not a plain accept"

[[step]]
service = "core"
command = { cmd = "bluetooth-reply-pin", pin = "12 4" }
expect_ack_error = true
note = "a PIN is 1-16 printable characters without spaces"

[[step]]
service = "core"
command = { cmd = "bluetooth-reply-pin", pin = "1234" }
expect = [ { event = "bluetooth-session-changed", pairing = { stage = "pairing" } } ]
note = "a PIN the remote does not expect"

[[step]]
service = "core"
command = { cmd = "bluetooth-tick", ms = 1000 }
expect = [ { event = "bluetooth-session-changed", paired = 2, pairing = { stage = "failed", reason = "rejected" } } ]
note = "the remote rejects the wrong PIN"

[[step]]
service = "core"
command = { cmd = "bluetooth-pair", device = "mock-bt-found-4" }
expect = [ { event = "bluetooth-session-changed", pairing = { stage = "request-pin" } } ]
note = "Try again"

[[step]]
service = "core"
command = { cmd = "bluetooth-reply-pin", pin = "0000" }
expect = [ { event = "bluetooth-session-changed", pairing = { stage = "pairing" } } ]
note = "the profile PIN"

[[step]]
service = "core"
command = { cmd = "bluetooth-tick", ms = 1000 }
expect = [ { event = "bluetooth-session-changed", paired = 3, connected = 2, pairing = { stage = "paired" } } ]
note = "bonded; a new bond connects"

[[step]]
service = "core"
command = { cmd = "bluetooth-forget", device = "mock-bt-found-4" }
expect = [ { event = "bluetooth-session-changed", paired = 2, connected = 1 } ]
note = "teardown: restore the saved list"

[[step]]
service = "core"
command = { cmd = "bluetooth-discovery", active = false }
note = "teardown"
