schema_version = 1
name = "outgoing-call-no-service"
description = "Outgoing call without registration is rejected with no-service; nothing imitates a connection."

[[step]]
service = "telephony"
command = { cmd = "set-radio", power = "on" }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-signal", bars = 3 }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "searching" }
expect = [ { event = "telephony-event", kind = "registration-changed", registration = { state = "searching" } } ]

[[step]]
service = "telephony"
command = { cmd = "set-outgoing-result", result = "no-service" }
ack = { status = "ok" }

[[step]]
service = "telephony"
command = { cmd = "dial", number = "+15550100011" }
expect_ack_error = true
note = "client verb; rejected with no-service"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
expect = [ { event = "telephony-event", kind = "registration-changed", registration = { state = "registered" } } ]
note = "teardown"
