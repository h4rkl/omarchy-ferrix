schema_version = 1
name = "sms-incoming-single"
description = "One incoming SMS is stored and published as received; the record carries a message id and state only, never the body."

[[step]]
service = "telephony"
command = { cmd = "set-radio", power = "on" }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-signal", bars = 3 }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "incoming-sms", number = "+15550100020", body = "synthetic single-part message" }
expect = [ { event = "telephony-event", kind = "sms-changed", sms = { direction = "incoming", state = "received" } } ]
