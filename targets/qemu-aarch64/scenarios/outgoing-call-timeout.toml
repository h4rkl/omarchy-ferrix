schema_version = 1
name = "outgoing-call-timeout"
description = "Outgoing call: nobody answers before the mock timeout (deterministic ticks, never wall clock)."

[[step]]
service = "telephony"
command = { cmd = "set-radio", power = "on" }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-signal", bars = 3 }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-outgoing-result", result = "timeout" }
ack = { status = "ok" }

[[step]]
service = "telephony"
command = { cmd = "dial", number = "+15550100010" }
expect = [ { event = "telephony-event", kind = "call-changed", call = { direction = "outgoing", state = "dialing" } } ]
note = "client verb"

[[step]]
service = "telephony"
command = { cmd = "tick", ms = 30000 }
expect = [ { event = "telephony-event", kind = "call-changed", call = { state = "ended", end_reason = { kind = "timed-out" } } } ]
note = "the mock times the unanswered call out on its deterministic clock"
