schema_version = 1
name = "sms-outgoing-failed"
description = "Outgoing SMS fails with a typed no-service failure; the message stays failed, nothing imitates delivery."

[[step]]
service = "telephony"
command = { cmd = "set-radio", power = "on" }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-signal", bars = 3 }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sms-result", result = "failed" }
ack = { status = "ok" }

[[step]]
service = "telephony"
command = { cmd = "send-sms", number = "+15550100031", body = "synthetic outgoing message" }
expect = [ { event = "telephony-event", kind = "sms-changed", sms = { direction = "outgoing" } } ]
note = "client verb"

[[step]]
service = "telephony"
command = { cmd = "fail-sms", reason = "no-service" }
expect = [ { event = "telephony-event", kind = "sms-changed", sms = { direction = "outgoing", state = "failed", failure = { kind = "no-service" } } } ]

[[step]]
service = "telephony"
command = { cmd = "set-sms-result", result = "sent" }
note = "teardown"
