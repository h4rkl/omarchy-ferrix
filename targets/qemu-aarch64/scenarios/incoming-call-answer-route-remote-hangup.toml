schema_version = 1
name = "incoming-call-answer-route-remote-hangup"
description = "Incoming call rings, is answered locally, audio is routed to the speaker, and the remote party hangs up."

[[step]]
service = "telephony"
command = { cmd = "set-radio", power = "on" }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-signal", bars = 3 }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "incoming-call", number = "+15550100042" }
expect = [ { event = "telephony-event", kind = "call-changed", call = { direction = "incoming", state = "ringing" } } ]

[[step]]
service = "telephony"
command = { cmd = "answer" }
expect = [ { event = "telephony-event", kind = "call-changed", call = { state = "active" } } ]
note = "client verb through the normal service path"

[[step]]
service = "telephony"
command = { cmd = "set-audio-route", route = "speaker" }
expect = [ { event = "telephony-event", kind = "audio-route-changed", audio = { active = "speaker" } } ]
note = "client verb"

[[step]]
service = "telephony"
command = { cmd = "tick", ms = 5000 }

[[step]]
service = "telephony"
command = { cmd = "remote-hangup" }
expect = [ { event = "telephony-event", kind = "call-changed", call = { state = "ended", end_reason = { kind = "remote-hangup" } } } ]
