schema_version = 1
name = "outgoing-call-rejected"
description = "Outgoing call: the remote party rejects."

[[step]]
service = "telephony"
command = { cmd = "set-radio", power = "on" }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-signal", bars = 3 }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-outgoing-result", result = "rejected" }
ack = { status = "ok" }

[[step]]
service = "telephony"
command = { cmd = "dial", number = "+15550100009" }
expect = [ { event = "telephony-event", kind = "call-changed", call = { direction = "outgoing", state = "dialing" } } ]
note = "client verb"

[[step]]
service = "telephony"
command = { cmd = "remote-reject" }
expect = [ { event = "telephony-event", kind = "call-changed", call = { state = "ended", end_reason = { kind = "rejected" } } } ]
