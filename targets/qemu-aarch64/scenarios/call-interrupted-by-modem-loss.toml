schema_version = 1
name = "call-interrupted-by-modem-loss"
description = "An active call ends with modem-lost when the modem fails; the service reconciles and reports the modem ready again afterwards."

[[step]]
service = "telephony"
command = { cmd = "set-radio", power = "on" }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-signal", bars = 3 }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "incoming-call", number = "+15550100012" }
expect = [ { event = "telephony-event", kind = "call-changed", call = { state = "ringing" } } ]

[[step]]
service = "telephony"
command = { cmd = "answer" }
expect = [ { event = "telephony-event", kind = "call-changed", call = { state = "active" } } ]
note = "client verb"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "failed" }
expect = [ { event = "telephony-event", kind = "modem-changed", modem = { state = "failed" } }, { event = "telephony-event", kind = "call-changed", call = { state = "ended", end_reason = { kind = "modem-lost" } } } ]
note = "the modem record precedes the call it tore down"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
expect = [ { event = "telephony-event", kind = "modem-changed", modem = { state = "ready" } } ]
