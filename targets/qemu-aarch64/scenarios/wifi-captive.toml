schema_version = 1
name = "wifi-captive"
description = "Connected to an open network behind a captive portal: connectivity reports portal with a synthetic URL, then full after the portal is cleared."

[[step]]
service = "network"
command = { cmd = "set-adapter", present = true }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "network"
command = { cmd = "set-radio", enabled = true }
note = "setup"

[[step]]
service = "network"
command = { cmd = "set-connect-result", result = "connected" }
ack = { status = "ok" }

[[step]]
service = "network"
command = { cmd = "connect", ssid = "ferrix-guest" }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "associating" } } ]
note = "client verb"

[[step]]
service = "network"
command = { cmd = "tick", ms = 5000 }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "connected" } } ]

[[step]]
service = "network"
command = { cmd = "set-connectivity", connectivity = "portal", url = "http://portal.ferrix.invalid/login" }
expect = [ { event = "network-event", kind = "connectivity-changed", connectivity = { state = "portal" } } ]

[[step]]
service = "network"
command = { cmd = "set-connectivity", connectivity = "full" }
expect = [ { event = "network-event", kind = "connectivity-changed", connectivity = { state = "full" } } ]
