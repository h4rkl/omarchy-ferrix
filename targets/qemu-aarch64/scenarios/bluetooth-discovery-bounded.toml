schema_version = 1
name = "bluetooth-discovery-bounded"
description = "Bluetooth discovery reveals the profile's synthetic discoverable devices and stops by itself after 30 s on the mock clock; a found device stays listed, unpaired."

[[step]]
service = "core"
command = { cmd = "set-bluetooth", present = true }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "core"
command = { cmd = "set-bluetooth-pairing-outcome" }
note = "setup: each device's profile outcome"

[[step]]
service = "core"
command = { cmd = "bluetooth-cancel" }
note = "setup: dismiss a finished attempt left by an earlier run"

[[step]]
service = "core"
command = { cmd = "bluetooth-discovery", active = true }
ack = { status = "ok", events = ["bluetooth-session-changed"] }
expect = [ { event = "bluetooth-session-changed", discovering = true, available = 7, paired = 2 } ]
note = "client verb: the product StartDiscovery through the portable capability"

[[step]]
service = "core"
command = { cmd = "bluetooth-tick", ms = 29999 }
ack = { status = "ok" }
note = "deterministic time, never wall clock: still scanning"

[[step]]
service = "core"
command = { cmd = "bluetooth-tick", ms = 1 }
expect = [ { event = "bluetooth-session-changed", discovering = false, available = 7 } ]
note = "the 30 s bound stops discovery"

[[step]]
service = "core"
command = { cmd = "bluetooth-discovery", active = true }
expect = [ { event = "bluetooth-session-changed", discovering = true } ]

[[step]]
service = "core"
command = { cmd = "bluetooth-discovery", active = false }
expect = [ { event = "bluetooth-session-changed", discovering = false } ]
note = "an explicit stop"
