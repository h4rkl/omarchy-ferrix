schema_version = 1
name = "bluetooth-pair-confirm-success"
description = "Numeric-comparison pairing with the synthetic headphones: the passkey prompt is accepted, the bond completes on the mock clock and connects; disconnect, connect, and forget follow."

[[step]]
service = "core"
command = { cmd = "set-bluetooth", present = true }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "core"
command = { cmd = "set-bluetooth-pairing-outcome" }
note = "setup"

[[step]]
service = "core"
command = { cmd = "bluetooth-cancel" }
note = "setup"

[[step]]
service = "core"
command = { cmd = "bluetooth-discovery", active = true }
expect = [ { event = "bluetooth-session-changed", discovering = true } ]

[[step]]
service = "core"
command = { cmd = "bluetooth-pair", device = "mock-bt-found-0" }
expect = [ { event = "bluetooth-session-changed", pairing = { stage = "confirm-passkey" } } ]
note = "client verb; the record carries the stage, never the passkey or the name"

[[step]]
service = "core"
command = { cmd = "bluetooth-reply", accept = true }
expect = [ { event = "bluetooth-session-changed", pairing = { stage = "pairing" } } ]
note = "the user confirmed the code"

[[step]]
service = "core"
command = { cmd = "bluetooth-tick", ms = 1000 }
expect = [ { event = "bluetooth-session-changed", paired = 3, connected = 2, pairing = { stage = "paired" } } ]
note = "the remote finishes the bond; a new bond connects"

[[step]]
service = "core"
command = { cmd = "bluetooth-disconnect", device = "mock-bt-found-0" }
expect = [ { event = "bluetooth-session-changed", connected = 1 } ]

[[step]]
service = "core"
command = { cmd = "bluetooth-connect", device = "mock-bt-found-0" }
expect = [ { event = "bluetooth-session-changed", connected = 2 } ]

[[step]]
service = "core"
command = { cmd = "bluetooth-forget", device = "mock-bt-found-0" }
expect = [ { event = "bluetooth-session-changed", paired = 2, connected = 1 } ]
note = "forget removes the bond; the found device stays listed, unpaired"

[[step]]
service = "core"
command = { cmd = "bluetooth-discovery", active = false }
note = "teardown"
