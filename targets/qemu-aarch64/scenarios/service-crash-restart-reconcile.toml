schema_version = 1
name = "service-crash-restart-reconcile"
description = "Backend crash and reconciliation inside each daemon: crash-backend drops the mock backend, tick-driven recovery restarts it and publishes service-restarted with a full snapshot. LIMITATION: this exercises backend loss and reconciliation, not a daemon process kill. In the QEMU guest a daemon process crash is recovered by init's supervise loop (daemon-restarted record), but no host-to-guest path exists to kill a guest process from CI, so process restart is only demonstrated nested on a Linux host and is not asserted here."

[[step]]
service = "telephony"
command = { cmd = "set-radio", power = "on" }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "telephony"
command = { cmd = "set-modem", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-sim", state = "ready" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "set-signal", bars = 3 }
note = "setup"

[[step]]
service = "network"
command = { cmd = "set-adapter", present = true }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "network"
command = { cmd = "set-radio", enabled = true }
note = "setup"

[[step]]
service = "telephony"
command = { cmd = "crash-backend" }
expect = [ { event = "telephony-backend-lost" }, { event = "telephony-event", kind = "modem-changed", modem = { state = "failed" } } ]
note = "the daemon records the loss and drops derived state"

[[step]]
service = "telephony"
command = { cmd = "tick", ms = 10000 }
expect = [ { event = "telephony-event", kind = "modem-changed", modem = { state = "ready" } }, { event = "telephony-event", kind = "service-restarted" } ]
timeout_ms = 10000
note = "recovery is tick-driven (deterministic, never wall clock): the restarted backend publishes a full snapshot"

[[step]]
service = "telephony"
command = { cmd = "set-registration", registration = "registered", roaming = false, operator = "Ferrix Mock", access = "lte" }
ack = { status = "ok" }
note = "reconciled: the snapshot already restored registration; this proves the restarted backend accepts commands"

[[step]]
service = "telephony"
command = { cmd = "state" }
ack = { status = "ok" }

[[step]]
service = "network"
command = { cmd = "crash-backend" }
expect = [ { event = "network-backend-lost" }, { event = "network-event", kind = "radio-changed", radio = { state = "unavailable" } } ]
note = "the daemon records the loss and marks the radio unavailable"

[[step]]
service = "network"
command = { cmd = "tick", ms = 1000 }
expect = [ { event = "network-event", kind = "service-restarted" } ]
note = "the next tick restarts the backend and publishes a full snapshot"

[[step]]
service = "network"
command = { cmd = "state" }
ack = { status = "ok" }
