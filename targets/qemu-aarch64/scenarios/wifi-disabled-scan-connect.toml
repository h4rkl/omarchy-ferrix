schema_version = 1
name = "wifi-disabled-scan-connect"
description = "Wi-Fi radio disabled, then enabled; a scan lists the synthetic access points; connecting to ferrix-lab completes and connectivity becomes full."

[[step]]
service = "network"
command = { cmd = "set-adapter", present = true }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "network"
command = { cmd = "set-radio", enabled = true }
note = "setup"

[[step]]
service = "network"
command = { cmd = "set-radio", enabled = false }
expect = [ { event = "network-event", kind = "radio-changed", radio = { state = "disabled" } } ]

[[step]]
service = "network"
command = { cmd = "set-radio", enabled = true }
expect = [ { event = "network-event", kind = "radio-changed", radio = { state = "enabled" } } ]

[[step]]
service = "network"
command = { cmd = "scan-result", outcome = "completed" }
ack = { status = "ok" }

[[step]]
service = "network"
command = { cmd = "scan" }
expect = [ { event = "network-event", kind = "scan-changed", scan = { state = "scanning" } } ]
note = "client verb through the normal service path; the mock advances on ticks"

[[step]]
service = "network"
command = { cmd = "tick", ms = 3000 }
expect = [ { event = "network-event", kind = "scan-changed", scan = { state = "completed", count = 2 } } ]
note = "deterministic time, never wall clock"

[[step]]
service = "network"
command = { cmd = "set-connect-result", result = "connected" }
ack = { status = "ok" }

[[step]]
service = "network"
command = { cmd = "connect", ssid = "ferrix-lab", passphrase = "mock-passphrase" }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "associating" } } ]
note = "client verb; synthetic passphrase"

[[step]]
service = "network"
command = { cmd = "tick", ms = 5000 }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "authenticating" } }, { event = "network-event", kind = "connection-changed", connection = { state = "configuring" } }, { event = "network-event", kind = "connection-changed", connection = { state = "connected" } }, { event = "network-event", kind = "connectivity-changed", connectivity = { state = "full" } } ]
note = "association, authentication, DHCP and the connectivity check advance on ticks"
