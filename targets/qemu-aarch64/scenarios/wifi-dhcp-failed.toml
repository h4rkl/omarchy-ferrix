schema_version = 1
name = "wifi-dhcp-failed"
description = "Association and authentication succeed but DHCP fails; the failure is typed dhcp-failed and connectivity stays none."

[[step]]
service = "network"
command = { cmd = "set-adapter", present = true }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "network"
command = { cmd = "set-radio", enabled = true }
note = "setup"

[[step]]
service = "network"
command = { cmd = "set-connect-result", result = "dhcp-failed" }
ack = { status = "ok" }

[[step]]
service = "network"
command = { cmd = "connect", ssid = "ferrix-guest" }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "associating" } } ]
note = "client verb; open network"

[[step]]
service = "network"
command = { cmd = "tick", ms = 5000 }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "configuring" } }, { event = "network-event", kind = "connection-changed", connection = { state = "failed", error = { kind = "dhcp-failed" } } } ]
note = "deterministic time, never wall clock"

[[step]]
service = "network"
command = { cmd = "set-connect-result", result = "connected" }
note = "teardown"
