schema_version = 1
name = "wifi-offline-recovered"
description = "A connected network drops (offline), then the access point returns and the connection and connectivity recover."

[[step]]
service = "network"
command = { cmd = "set-adapter", present = true }
note = "setup: restore the profile boot state (mock state persists across scenarios)"

[[step]]
service = "network"
command = { cmd = "set-radio", enabled = true }
note = "setup"

[[step]]
service = "network"
command = { cmd = "set-connect-result", result = "connected" }
ack = { status = "ok" }

[[step]]
service = "network"
command = { cmd = "connect", ssid = "ferrix-lab", passphrase = "mock-passphrase" }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "associating" } } ]
note = "setup: client verb"

[[step]]
service = "network"
command = { cmd = "tick", ms = 5000 }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "connected" } }, { event = "network-event", kind = "connectivity-changed", connectivity = { state = "full" } } ]

[[step]]
service = "network"
command = { cmd = "disconnect", reason = "ap-lost" }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "failed", error = { kind = "backend" } } }, { event = "network-event", kind = "connectivity-changed", connectivity = { state = "none" } } ]
note = "loss of the access point is a typed backend failure carrying the reason"

[[step]]
service = "network"
command = { cmd = "tick", ms = 5000 }

[[step]]
service = "network"
command = { cmd = "connect", ssid = "ferrix-lab", passphrase = "mock-passphrase" }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "associating" } } ]
note = "client verb: reconnect"

[[step]]
service = "network"
command = { cmd = "tick", ms = 5000 }
expect = [ { event = "network-event", kind = "connection-changed", connection = { state = "connected" } }, { event = "network-event", kind = "connectivity-changed", connectivity = { state = "full" } } ]
