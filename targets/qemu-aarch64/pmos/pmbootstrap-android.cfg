# OPT-IN variant of pmbootstrap.cfg (FERRIX_PMOS_ANDROID=1): identical except
# extra_packages also pulls the Waydroid container stack from the pinned
# Alpine community mirror (docs/android-runtime.md section 6.1). Keep both
# files in sync; the default pmos-build/pmos-check/CI never read this file.
# pmbootstrap v3 configuration for the postmarketOS QEMU guest route.
# Replaces the interactive `pmbootstrap init`; the build script copies it to the
# cache and passes it with --config. Paths are container paths (see
# containers/guest-builder). The channel comes from the pinned pmaports
# checkout (pmaports.cfg), not from this file.
[pmbootstrap]
work = /cache/pmbootstrap/work
aports = /cache/pmbootstrap/work/cache_git/pmaports
device = qemu-aarch64
kernel = stable
# The UI package remains console because Omarchy Ferrix supplies its own compositor
# and surface rather than installing a postmarketOS desktop environment.
ui = console
ui_extras = False
# postmarketos-ui-console defaults to systemd on v26.06. OpenRC is pinned here
# on purpose: the project readiness marker is an /etc/local.d script run by the
# OpenRC `local` service, which starts last in the default runlevel.
service_manager = openrc
user = user
hostname = ferrix
extra_packages = seatd,eudev,libinput,libseat,libdrm,pixman,libxkbcommon,mesa-gbm,libgcc,waydroid,waydroid-openrc,waydroid-nftrules,nftables,lxc,dnsmasq,pulseaudio,dbus
# The Android system/vendor images are staged into the root filesystem during
# finalize, after pmbootstrap estimates the package-only root size. Reserve
# enough space for those immutable images and Waydroid's writable state.
# This is deliberately Android-route-only; the default smoke image stays small.
extra_space = 4096
timezone = UTC
locale = en_US.UTF-8
ssh_keys = False
is_default_channel = False
# Install only binary packages from the pinned channel's repository; never
# compile pmaports on the fly, so the manifest describes what was installed.
build_pkgs_on_install = False
sudo_timer = False

[providers]

[mirrors]
