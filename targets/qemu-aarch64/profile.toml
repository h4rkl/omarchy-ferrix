schema_version = 1
name = "emulator-dev"

[display]
width = 1080
height = 2340
scale = 1.0
orientation = "portrait"

[input]
touch = true
rotation = true

[power]
battery_percent = 75
charging = false

[connectivity]
wifi = "connected"
bluetooth_present = true
modem = "registered"
sim = "present"

[audio]
route = "speaker"

# Detailed mock telephony state (ADR-006). Synthetic values only: the mock
# adapter in ferrix-telephonyd starts from these; the host mock-control
# channel `ferrix.telephony` mutates them. Never a carrier or device fact.
[telephony]
modem = "ready"
sim = "ready"
sim_pin = "0000"
operator = "Ferrix Mock"
access = "lte"
signal_bars = 3
roaming = false
features = ["voice", "sms", "multipart-sms", "delivery-reports", "dtmf", "hold", "audio-route", "sim-pin", "radio-power", "mic-mute", "data"]

# Detailed mock network state (ADR-006). Synthetic access points for the mock
# adapter in ferrix-networkd; `connected` names the one joined at boot.
[network]
adapter = "present"
radio = "enabled"
connected = "ferrix-lab"

[[network.access_points]]
ssid = "ferrix-lab"
security = "wpa2-psk"
signal_percent = 78
passphrase = "mock-passphrase"

[[network.access_points]]
ssid = "ferrix-guest"
security = "open"
signal_percent = 41

# Synthetic Bluetooth devices the mock controller remembers (Settings lists
# them). Mock only: no real names or hardware addresses.
[[bluetooth.devices]]
name = "Ferrix Mock Earbuds"
kind = "audio"
paired = true
connected = true

[[bluetooth.devices]]
name = "Ferrix Mock Speaker"
kind = "audio"
paired = true

[[bluetooth.devices]]
name = ""

# Synthetic devices the mock controller finds once discovery starts. Each
# fixes its pairing method and how the remote ends the attempt, so the
# Pair-new-device flows are deterministic (ferrix-core control commands
# bluetooth-* and bluetooth-tick drive them; see the scenarios).
[[bluetooth.discoverable]]
name = "Ferrix Mock Headphones"
kind = "audio"
rssi = -48
pairing = "confirm"
outcome = "success"
passkey = 482913

[[bluetooth.discoverable]]
name = "Ferrix Mock Keyboard"
kind = "input"
rssi = -63
pairing = "display-passkey"
outcome = "success"
passkey = 205718

[[bluetooth.discoverable]]
name = "Ferrix Mock Phone"
kind = "phone"
rssi = -70
pairing = "authorize"
outcome = "success"

[[bluetooth.discoverable]]
name = "Ferrix Mock Watch"
kind = "wearable"
rssi = -74
pairing = "confirm"
outcome = "rejected"
passkey = 731064

[[bluetooth.discoverable]]
name = "Ferrix Mock Legacy Headset"
kind = "audio"
rssi = -81
pairing = "pin"

[[bluetooth.discoverable]]
name = "Ferrix Mock Car Kit"
kind = "audio"
rssi = -88
pairing = "just-works"
outcome = "timeout"
