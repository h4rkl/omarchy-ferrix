# Target-local pmbootstrap configuration for the native Linux rootfs slice.
# tools/pixel-9a/rootfs.sh resolves work/aports to an ignored build directory.
# This configuration intentionally does not select a kernel or flash method:
# the Google Kleaf kernel and Pixel split-boot composer are separate inputs.
[pmbootstrap]
work = /var/empty/ferrix-pixel9a-rootfs-work
aports = /var/empty/ferrix-pixel9a-pmaports
device = google-tegu
kernel = none
ui = console
ui_extras = False
service_manager = openrc
user = user
hostname = ferrix-tegu
extra_packages = eudev,eudev-openrc,libinput,libseat,libdrm,pixman,libxkbcommon,mesa-gbm,libgcc,networkmanager,networkmanager-openrc,exynos-modem,modemmanager-samsung-sit,modemmanager-samsung-sit-openrc,bluez,bluez-openrc,pipewire,pipewire-spa-bluez,wireplumber,upower,seatd,seatd-openrc,dbus,dbus-openrc
extra_space = 0
timezone = UTC
locale = en_US.UTF-8
ssh_keys = False
is_default_channel = False
build_pkgs_on_install = True
sudo_timer = False

[providers]
postmarketos-base-ui-audio-backend = postmarketos-base-ui-audio-backend-pipewire

[mirrors]
