# Target-local channel metadata for the pinned v26.06 pmaports checkout.
# The v26.06 branch no longer carries the legacy channels.cfg file; keep the
# pmbootstrap channel lookup explicit and reviewable instead of consulting an
# unpinned origin/main file.
# Reference: https://postmarketos.org/channels.cfg
[channels.cfg]
recommended=v26.06

[v26.06]
description=Latest release / Recommended for best stability
branch_pmaports=v26.06
branch_aports=3.24-stable
mirrordir_alpine=v3.24
