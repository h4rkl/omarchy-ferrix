# Vendor cmdline for the Google Kleaf GKI development route. The tegu DTB
# bootargs already carry earlycon/console; the bootloader appends both. The
# Ferrix /init (initramfs-init-kleaf) finds PARTLABEL=userdata itself.
console=ttySAC0,115200n8
loglevel=7
printk.devkmsg=on
firmware_class.path=/lib/firmware
bootconfig
