# Vendor cmdline for the Google Kleaf GKI development route, taken from the
# stock CP3A.260905.009 vendor_boot (the GKI and vendor modules depend on
# several of these, e.g. android_arch_task_struct_size and swiotlb) with the
# Android-only console/dyndbg entries dropped. The Ferrix /init
# (initramfs-init-kleaf) finds PARTLABEL=userdata itself.
earlycon=exynos4210,0x10870000
console=ttySAC0,115200
printk.devkmsg=on
cma_sysfs.experimental=Y
cgroup.memory=nokmem
rcupdate.rcu_expedited=1
rcu_nocbs=all
rcutree.enable_rcu_lazy
swiotlb=noforce
disable_dma32=on
sysctl.kernel.sched_pelt_multiplier=4
rodata=on
kasan=off
at24.write_timeout=100
log_buf_len=1024K
android_arch_task_struct_size=784
loglevel=7
firmware_class.path=/lib/firmware
bootconfig
