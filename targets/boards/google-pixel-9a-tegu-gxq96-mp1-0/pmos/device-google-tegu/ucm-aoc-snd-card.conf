# google-pixel-9a-tegu-gxq96-mp1-0 only. alsa-lib reaches this file through
# alsa-ucm-conf's ucm.conf as conf.d/${CardDriver}/${CardDriver}.conf. The
# card driver is AOC_SND_CARD "aoc-snd-card" (pinned aoc alsa/aoc_alsa.h).
# Every AoC Pixel shares that driver name. The use case is defined only on the
# exact tegu device tree with the TAS25xx codec bound. Otherwise alsa-lib finds
# no verb and PipeWire keeps its non-UCM fallback.

If.tegu {
	Condition {
		Type String
		String1 "${sys:firmware/devicetree/base/model}"
		String2 "ZUMA PRO TEGU MP on ZUMA PRO"
	}
	True {
		If.tas25xx {
			Condition {
				Type ControlExists
				Control "name='TAS25XX ASI Switch'"
			}
			True {
				SectionUseCase."HiFi" {
					File "/Google/tegu/HiFi.conf"
					Comment "Discovery only: no route enabled"
				}
			}
		}
	}
}
