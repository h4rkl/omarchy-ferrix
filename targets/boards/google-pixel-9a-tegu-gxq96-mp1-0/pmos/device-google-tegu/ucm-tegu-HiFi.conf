# google-pixel-9a-tegu-gxq96-mp1-0 AoC card.
#
# The verb and the Speaker stay discovery-only: no sequence, cset, exec or
# volume element, because PipeWire's ACP runs verb and device sequences when it
# probes and selects a profile at session start, and internal speaker output is
# NO-GO without a protection contract (#94, audio-route-decision.md).
#
# The Mic device alone routes capture. Owner-approved physical measurement
# (2026-11-24, docs/status-log/2026-11.md): with "BUILDIN MIC ID CAPTURE LIST"
# 0,-1,-1,-1 channel 1 of PCM 8 is digital zero; with 0,1,-1,-1 both channels
# pick up the controlled host tone (tone gate 11.9 dB and 27.0 dB). Its
# sequences write only that list and "EP1 TX Mixer INTERNAL_MIC_TX", and the
# DisableSequence restores both to their boot values.
#
# PCM numbers come from the physical /proc/asound/pcm inventory:
#   00-00 "EP1 playback"  (FE audio_playback0)
#   00-08 "EP1 capture"   (FE audio_capture0)
# Rates and channels match the observed TDM_0_RX and INTERNAL_MIC_TX defaults
# (Chan "Two", Sample Rate "SR_48K").
#
# Both front ends are dynamic DPCM links. Until a mixer path such as
# "TDM_0_RX Mixer EP1" connects a back end, the pinned GKI soc-pcm.c rejects
# prepare with "no backend DAIs enabled". That error is expected here.

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	EnableSequence [
		cset "name='BUILDIN MIC ID CAPTURE LIST' 0,1,-1,-1"
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' on"
	]

	DisableSequence [
		cset "name='EP1 TX Mixer INTERNAL_MIC_TX' off"
		cset "name='BUILDIN MIC ID CAPTURE LIST' 0,-1,-1,-1"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
		CaptureRate 48000
	}
}
