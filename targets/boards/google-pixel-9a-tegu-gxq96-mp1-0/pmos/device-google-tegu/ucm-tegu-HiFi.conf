# google-pixel-9a-tegu-gxq96-mp1-0 AoC card, discovery only.
#
# This verb names the observed speaker and internal-microphone front ends and
# writes no mixer control. It has no EnableSequence, DisableSequence, cset,
# exec, or volume element. PipeWire's ACP runs verb and device sequences when
# it probes and selects a profile at session start, so a route here would be
# enabled at boot. Speaker and microphone routing waits for an owner-approved
# physical measurement (see audio-route-decision.md).
#
# PCM numbers come from the physical /proc/asound/pcm inventory:
#   00-00 "EP1 playback"  (FE audio_playback0)
#   00-08 "EP1 capture"   (FE audio_capture0)
# Rates and channels match the observed TDM_0_RX and INTERNAL_MIC_TX defaults
# (Chan "Two", Sample Rate "SR_48K").
#
# Both front ends are dynamic DPCM links. Until a mixer path such as
# "TDM_0_RX Mixer EP1" connects a back end, the pinned GKI soc-pcm.c rejects
# prepare with "no backend DAIs enabled". That error is expected here.

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackRate 48000
	}
}

SectionDevice."Mic" {
	Comment "Internal Microphone"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},8"
		CaptureChannels 2
		CaptureRate 48000
	}
}
