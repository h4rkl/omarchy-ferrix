# NetworkManager policy for the tegu Broadcom bcm4383 (installed as
# /etc/NetworkManager/conf.d/90-ferrix.conf).

[keyfile]
# Only wlan0 is the station interface. wlan1 (STA/AP concurrency), the NAN
# interface, and P2P devices belong to features Ferrix does not drive yet;
# letting NetworkManager scan on them doubles the scan load.
unmanaged-devices=interface-name:wlan1;interface-name:aware_nmi*;interface-name:p2p-dev-*

[device]
# bcmdhd randomises the scan MAC in firmware (scanmac); NetworkManager's
# host-side randomisation fails with "set cur_etheraddr failed".
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=preserve
