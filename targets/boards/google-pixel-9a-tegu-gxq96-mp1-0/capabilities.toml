target_id = "google-pixel-9a-tegu-gxq96-mp1-0"

# These are deliberately conservative: read-only Android identity discovery is
# not Ferrix Linux hardware evidence. No QEMU/mock result is reused here.
# ferrix-target-pixel9a compiles this file into its capability matrix.
[power]
status = "supported"
evidence = "UPower battery and charger state through ferrix-power-upower reached ferrix-core and the home surface. 2026-10-09 Kleaf dev route (slot b, images composed by tools/pixel-9a/dev-compose.py); see docs/status.md."

[display]
status = "supported"
evidence = "ferrix-shell scans out 1080x2424 portrait on the DSI panel with profile byte order and safe area; scanout read back via DRM GETFB2 and checked on camera. 2026-10-09 Kleaf dev route (slot b, images composed by tools/pixel-9a/dev-compose.py); see docs/status.md."

[input]
status = "supported"
evidence = "synaptics_tcm_touch and uinput test touch/keyboard devices reach ferrix-shell through libinput; taps launch apps and drive the on-screen keyboard. 2026-10-09 Kleaf dev route (slot b, images composed by tools/pixel-9a/dev-compose.py); see docs/status.md."

[network]
status = "supported"
evidence = "bcm4383 Wi-Fi scans and joins a WPA2/WPA3 transition AP with WPA3-SAE (driver patched for NL80211 WPA version 3) and WPA2-PSK through NetworkManager and ferrix-networkd (DHCP, ping). 2026-10-09 Kleaf dev route (slot b, images composed by tools/pixel-9a/dev-compose.py); see docs/status.md."

[bluetooth]
status = "supported"
evidence = "ferrix-bluetooth-uart attaches the BCM4383 controller (btattach -P bcm on ttySAC18, brcm/BCM.hcd); ferrix-core reports present/enabled through ferrix-bluetooth-bluez and BlueZ scans find devices. Pairing UI discovery verified; pairing not exercised on hardware; link runs at 115200 baud. 2026-10-09 Kleaf dev route; see docs/status.md."

[audio]
status = "unsupported"
evidence = "Not physically verified. Observed on the Kleaf dev route (2026-10-11): no ALSA card, because the AoC DSP was never started (aoc_core probes, google-aoc-snd-card defers on 'wait for aoc output ctrl'); PipeWire offers only Dummy Output. Offline-only route, not yet booted: stage vendor.img aoc.bin, tismartpa_driver_tuning.bin and the cs40l26 haptics images (audio-aoc, audio-tas25xx, haptics-cs40l26; the card's haptics back end needs cs40l26 to probe) and have ferrix-aoc-firmware write aoc.bin to the AoC firmware attribute, as Android's aocd does. No mixer/UCM routing or speaker protection configuration yet; see audio-bringup.md."

