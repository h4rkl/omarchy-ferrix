# Associated-radio boundary.  KEPLER is a source-built kernel raw-device
# contract only; no location parser or service is selected until a native
# Linux boot establishes the BETP startup/data path.  The NFC/ST54 names below
# are comparison-route Android modules and must never enter this Kbuild route.
gnss_binding = "samsung,kepler"
gnss_driver_source = "drivers/gnss/kepler.c"
gnss_runtime_device_glob = "/dev/gnss*"
gnss_userspace_status = "raw-device-only"
nfc_route_status = "not-selected"
nfc_comparison_modules = "st21nfc.ko,st54spi.ko"
st54_route_status = "not-selected"

# These symbols are checked after Kbuild merges defconfig + tegu.config. The
# route is useful specifically because it exposes the S5300 WWAN/SIT ports, the
# BCM4383 Wi-Fi/Bluetooth hardware, and the candidate's built-in Samsung Kepler
# GNSS path in a native Linux kernel contract. NFC/ST54 and UWB are deliberately
# not selected; see associated-radio-audit.md.
required_config = [
  "CONFIG_NET=y",
  "CONFIG_NET_CORE=y",
  "CONFIG_NETDEVICES=y",
  "CONFIG_INET=y",
  "CONFIG_IPV6=y",
  "CONFIG_WWAN=y",
  "CONFIG_S5300_MODEM=y",
  "CONFIG_SPI=y",
  "CONFIG_GNSS=y",
  "CONFIG_GNSS_KEPLER=y",
  "CONFIG_BLK_DEV_DM=y",
  "CONFIG_RFKILL=y",
  "CONFIG_CFG80211=y",
  "CONFIG_BRCMFMAC=y",
  "CONFIG_BRCMFMAC_PCIE=y",
  "CONFIG_BT=y",
  "CONFIG_BT_LE=y",
  "CONFIG_BT_HCIUART=y",
  "CONFIG_BT_HCIUART_H4=y",
  "CONFIG_BT_HCIUART_SERDEV=y",
  "CONFIG_BT_HCIUART_BCM=y",
  "CONFIG_SERIAL_DEV_BUS=y",
  "CONFIG_DRM_EXYNOS_ZUMAPRO_DPU=y",
  "CONFIG_PCIE_ZUMAPRO=y",
]
