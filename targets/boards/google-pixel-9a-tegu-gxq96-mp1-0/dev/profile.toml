# Target-local guest profile for staging as /etc/ferrix/profile.toml.
#
# This is not targets/qemu-aarch64/profile.toml and contains no synthetic
# access points, mock telephony data, battery claims, or QEMU controls. The
# strict profile schema requires the coarse sections below; on the physical
# target their runtime values are supplied by the native Linux adapters.

schema_version = 1
name = "pixel-9a-native-linux"

[display]
width = 1080
height = 2424
scale = 1.0
orientation = "portrait"
# The exynos DPU reads 32-bit DRM fourccs byte-reversed (AB24 as RA24);
# verified with libdrm modetest colour bars on this exact target.
scanout_byte_order = "reversed"
# Panel pixels, portrait, from the CP3A factory framework overlay
# (framework-res__tegu__auto_generated_rro_vendor.apk): the hole-punch cutout
# is a circle at (540, 86) r 41.5 (lower edge 128 px, rect approximation
# 484..596 x 0..152), corners are r 115 top and bottom, and the stock portrait
# status bar is 52dp at ro.sf.lcd_density=420 (137 px). Top 137 keeps every
# client clear of the camera; bottom 72 equals ferrix-shell's home-gesture
# zone (bottom 3%), so no client control sits under the system gesture and
# the compositor's home indicator has its own strip.
safe_area = { top = 137, bottom = 72 }

[input]
touch = true
rotation = true

# Neutral schema values only. ferrix-power and the production radio/audio
# adapters are authoritative once the guest services are running.
[power]
battery_percent = 0
charging = false

[connectivity]
wifi = "disconnected"
bluetooth_present = true
modem = "unregistered"
sim = "absent"
# Transition-mode APs join with SAE (the default): the bcm4383 driver accepts
# NL80211_WPA_VERSION_3 with kernel-patches/.../0002 (verified 2026-10-09).

[audio]
route = "speaker"

