# Linux CI for the emulator-first project (see AGENTS.md and plans/baseline.md).
#
# Six jobs, each its own required check (none depends on another except
# qemu-scenario-check on qemu-check):
#   docs                - Markdown relative-link and #anchor check over every
#                         tracked *.md, plus the docs/status.md current-state
#                         and docs/status-log/ structure tests (stdlib Python).
#   rust                - host toolchain checks (fmt, clippy, test) on ubuntu-latest.
#                         The hosted runner denies uid_map/setgroups and mounts in
#                         an unprivileged user namespace, so the real-namespace
#                         tests in crates/ferrix-runtime-native/tests/sandbox.rs
#                         probe as degraded and print `sandbox-test-skipped`
#                         here; every other test runs normally.
#   pixel-9a-offline    - every offline Pixel 9a test (`just pixel-9a-test-offline`
#                         via tools/pixel-9a/test-offline.sh) with stubbed
#                         adb/fastboot/guest. Evidence label: mock. Tests in
#                         tools/pixel-9a/tests/quarantine-linux.txt (#127) run
#                         but cannot fail the job.
#   sandbox-check       - those sandbox tests for real: `just linux-check test -p
#                         ferrix-runtime-native` in the pinned privileged arm64
#                         builder container with FERRIX_SANDBOX_TESTS=required,
#                         so any skip fails the job. Evidence label: mock
#                         (container on the runner kernel, not QEMU, not hardware).
#   qemu-check          - the SAME headless contract used locally: `just qemu-build`
#                         followed by `just qemu-check`, run under TCG with no display,
#                         no KVM, no physical device. Evidence label: QEMU.
#   qemu-scenario-check - every checked-in telephony/network scenario
#                         (ADR-006) against the guest built by qemu-check, in
#                         a headless TCG agent session. Runs on pushes and
#                         manual dispatch; on pull requests only when the PR
#                         carries the `scenarios` label, so the PR gate keeps
#                         qemu-check's cost.
#
# Runner choice for qemu-check and sandbox-check: GitHub's arm64 hosted runner
# (`ubuntu-24.04-arm`, free for public repositories). qemu-build.sh runs
# `--platform linux/arm64` Docker containers to cross-build the guest Rust
# binaries and assemble the initramfs; on an arm64 runner those containers run
# natively. On an x86 runner they would run under qemu-user emulation, and
# compiling Rust under emulation is far too slow for a CI gate.
#
# Fallback if arm64 runners are unavailable (private repo without a larger
# runner, capacity issues): dispatch this workflow manually and pick
# `ubuntu-latest` as `qemu_runner`. The job then registers arm64 binfmt
# handlers via docker/setup-qemu-action so the linux/arm64 containers run under
# qemu-user; expect the build phase to take much longer (the job timeout is
# raised accordingly). qemu-system-aarch64 itself uses TCG on every runner, so
# the contract test is identical on both architectures.
name: CI

on:
  push:
    branches: [main]
  # Include `labeled` so applying the opt-in label after PR creation starts
  # the scenario job without another code change.
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      qemu_runner:
        description: Runner label for the qemu-check, qemu-scenario-check and sandbox-check jobs
        type: choice
        default: ubuntu-24.04-arm
        options:
          - ubuntu-24.04-arm
          - ubuntu-latest

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  docs:
    name: Docs (links, status log, current state)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest ships Python >= 3.12; the scripts need >= 3.11 (tomllib)
      # and only the standard library.
      - name: Markdown links and anchors
        run: python3 tools/dev/check-links.py

      # The history half of this test needs the pre-split blob and skips in
      # this shallow checkout; the structural checks always run.
      - name: Status log structure
        run: python3 tools/dev/tests/status-log.py

      - name: Status current state matches the capability matrices
        run: python3 tools/dev/tests/status-current-state.py

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml is the single source of truth for the channel,
      # components (rustfmt, clippy) and targets. With no argument, rustup
      # installs exactly what that file declares.
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: License policy
        run: sh tools/dev/license-check.sh

      - name: Install compositor development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libseat-dev libinput-dev libudev-dev libdrm-dev \
            libpixman-1-dev libxkbcommon-dev libgbm-dev libegl1-mesa-dev

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Portable tests. The native sandbox integration tests skip here with
      # `sandbox-test-skipped` records; sandbox-check is their gate.
      - name: cargo test
        run: cargo test --workspace

  pixel-9a-offline:
    name: Pixel 9a offline tests (mock)
    runs-on: ubuntu-latest
    # The full set takes about 25 minutes on a laptop; a2dp-active-proof alone
    # is about 6.
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # exynos-modem-cpif-adapter.sh runs cargo natively on Linux.
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      # Every offline Pixel 9a test under tools/pixel-9a/tests/ (stubbed
      # adb/fastboot/guest; no device). The runner discovers the tests, so a
      # new tests/<feature>.sh or .py is gated here without a CI edit. gawk
      # and busybox let the S5300 services test exercise every awk it
      # supports; e2fsprogs backs the dev-compose ext4 staging check. The
      # adapter test fetches the hash-pinned exynos-modem archive and
      # Cargo.lock crates, applies the target-local patches, and runs the
      # patched tests and CLI contract natively. Evidence label: mock.
      - name: Install Pixel 9a offline test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gawk busybox e2fsprogs

      - name: Pixel 9a offline tests (mock)
        env:
          FERRIX_S5300_ADAPTER_FETCH: "1"
          FERRIX_S5300_ADAPTER_FULL: "1"
        run: sh tools/pixel-9a/test-offline.sh

  sandbox-check:
    name: Native sandbox (privileged container, arm64)
    runs-on: ${{ inputs.qemu_runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: ${{ inputs.qemu_runner == 'ubuntu-latest' && 120 || 30 }}
    env:
      # Every sandbox test must run: a skip (degraded probe, no /run access)
      # is a failure, so this check cannot pass vacuously.
      FERRIX_SANDBOX_TESTS: required
      # Cargo registry + linux-check target directory used by the container.
      FERRIX_CACHE_DIR: ${{ github.workspace }}/.cache/ferrix
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # x86 fallback only, as in qemu-check: linux-check.sh runs the pinned
      # linux/arm64 builder image.
      - name: Register arm64 binfmt handlers (x86 fallback only)
        if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/arm64

      - name: Install just
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0

      - name: Restore linux-check cache
        id: linux-check-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/ferrix/cargo-registry
            .cache/ferrix/linux-check-target
          key: ferrix-linux-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'targets/qemu-aarch64/scripts/linux-check.sh') }}
          restore-keys: |
            ferrix-linux-check-${{ runner.os }}-${{ runner.arch }}-

      - name: just linux-check test -p ferrix-runtime-native
        run: just linux-check test -p ferrix-runtime-native

      # The privileged builder writes cache files as root. Let the runner
      # read them before actions/cache/save, including after a failing test.
      - name: Make linux-check cache readable by the runner
        if: always() && steps.linux-check-cache.outputs.cache-hit != 'true'
        run: |
          if [ -d .cache/ferrix ]; then
            sudo chown -R "$(id -u):$(id -g)" .cache/ferrix
          fi

      - name: Save linux-check cache
        if: always() && steps.linux-check-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/ferrix/cargo-registry
            .cache/ferrix/linux-check-target
          key: ${{ steps.linux-check-cache.outputs.cache-primary-key }}

  qemu-check:
    name: QEMU headless contract (TCG)
    # Empty on push/pull_request (no inputs), so the arm64 runner is the default.
    runs-on: ${{ inputs.qemu_runner || 'ubuntu-24.04-arm' }}
    # The x86 fallback cross-builds Rust under qemu-user emulation and needs
    # a much larger ceiling than the native arm64 run.
    timeout-minutes: ${{ inputs.qemu_runner == 'ubuntu-latest' && 180 || 60 }}
    env:
      # Always portable TCG: no KVM/HVF required for correctness.
      FERRIX_QEMU_ACCEL: tcg
      # Bounded wait for the guest smoke check, in seconds. The local default
      # (45 s) is tuned for an Apple Silicon host; TCG on a hosted runner is
      # slower, so give the guest more headroom. This is only a ceiling: the
      # check still ends as soon as the guest powers off.
      FERRIX_QEMU_CHECK_TIMEOUT: "300"
      # Cargo registry + guest target directory used by the build containers.
      FERRIX_CACHE_DIR: ${{ github.workspace }}/.cache/ferrix
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # x86 fallback only: register binfmt handlers so Docker can run the
      # pinned linux/arm64 builder images under qemu-user. Skipped on arm64,
      # where the containers run natively.
      - name: Register arm64 binfmt handlers (x86 fallback only)
        if: runner.arch != 'ARM64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: linux/arm64

      # qemu-run.sh needs qemu-system-aarch64 (Ubuntu ships it in
      # qemu-system-arm); qemu-build.sh needs cpio (gzip, tar, awk, shasum
      # via perl, python3 and Docker are already on the runner image).
      # Ubuntu's QEMU still loads efi-virtio.rom for the virtio-serial PCI
      # device during direct kernel boot. --no-install-recommends omits the
      # ipxe-qemu package that provides it, so name that prerequisite here.
      - name: Install host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm cpio ipxe-qemu

      - name: Install just
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0

      - name: Report host prerequisites
        run: |
          for tool in docker qemu-system-aarch64 cpio gzip shasum python3 just; do
            command -v "$tool" >/dev/null || { echo "missing $tool" >&2; exit 2; }
          done
          docker version --format 'docker {{.Server.Version}} ({{.Server.Os}}/{{.Server.Arch}})'
          qemu-system-aarch64 --version | head -1
          test -r /usr/lib/ipxe/qemu/efi-virtio.rom || { echo "missing ipxe-qemu efi-virtio.rom" >&2; exit 2; }
          just --version
          python3 --version

      # Cargo registry and the guest target directory. Restored before the
      # build and saved even when the QEMU check fails, so a red run still
      # warms the cache for the next attempt.
      - name: Restore guest build cache
        id: guest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ferrix
          key: ferrix-guest-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'targets/qemu-aarch64/scripts/qemu-build.sh') }}
          restore-keys: |
            ferrix-guest-${{ runner.os }}-${{ runner.arch }}-

      - name: just qemu-build
        run: just qemu-build

      - name: just qemu-check
        run: just qemu-check

      # The pinned builder runs as root in Docker and leaves cache files owned
      # by root. The runner must be able to read them before actions/cache.
      - name: Make guest cache readable by the runner
        if: always() && steps.guest-cache.outputs.cache-hit != 'true'
        run: |
          if [ -d .cache/ferrix ]; then
            sudo chown -R "$(id -u):$(id -g)" .cache/ferrix
          fi

      - name: Save guest build cache
        if: always() && steps.guest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ferrix
          key: ${{ steps.guest-cache.outputs.cache-primary-key }}

      # Preserve the serial log and the pinned-input manifest on success and
      # failure alike; the serial log is the machine-readable evidence.
      - name: Upload QEMU evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-aarch64-evidence-${{ runner.arch }}
          path: |
            out/qemu-aarch64/serial.log
            out/qemu-aarch64/manifest.json
          if-no-files-found: warn
          retention-days: 14

      # Hand the built guest to the scenario job so it builds nothing for
      # the guest (short retention: it is an intermediate, not evidence).
      - name: Upload guest artifacts for the scenario job
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-aarch64-guest-${{ runner.arch }}
          path: |
            out/qemu-aarch64/Image
            out/qemu-aarch64/initramfs.cpio.gz
            out/qemu-aarch64/manifest.json
          if-no-files-found: error
          retention-days: 1

  qemu-scenario-check:
    name: QEMU scenarios (TCG, headless)
    needs: qemu-check
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'scenarios')
    runs-on: ${{ inputs.qemu_runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 45
    env:
      FERRIX_QEMU_ACCEL: tcg
      FERRIX_QEMU_GRAPHICS: none
      # Whole-run ceiling for the scenario set (readiness wait + every scenario).
      FERRIX_QEMU_SCENARIO_TIMEOUT: "1200"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install host prerequisites
        run: |
          sudo apt-get update
          # The virtio-gpu PCI device requests efi-virtio.rom even with
          # -display none. Ubuntu keeps it in the recommended ipxe-qemu
          # package, which --no-install-recommends omits.
          sudo apt-get install -y --no-install-recommends qemu-system-arm ipxe-qemu
          test -f /usr/lib/ipxe/qemu/efi-virtio.rom

      - name: Install just
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: just@1.58.0

      # The host runner binary (ferrix-scenario) is the only thing compiled
      # here; the toolchain comes from rust-toolchain.toml.
      - name: Install toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show

      - name: Cache cargo registry and target directory
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Download guest artifacts from qemu-check
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v5.0.0
        with:
          name: qemu-aarch64-guest-${{ runner.arch }}
          path: out/qemu-aarch64

      - name: just qemu-scenario-check
        run: just qemu-scenario-check

      # One result.json plus log excerpt per scenario, pass or fail, and the
      # session's serial and launch logs. The launch log explains failures
      # before the guest can write a serial record.
      - name: Upload scenario evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qemu-aarch64-scenarios-${{ runner.arch }}
          path: |
            out/qemu-aarch64/scenarios/**/result.json
            out/qemu-aarch64/scenarios/**/log-excerpt.log
            out/qemu-aarch64/agent/serial.log
            out/qemu-aarch64/agent/launch.log
          if-no-files-found: warn
          retention-days: 14
