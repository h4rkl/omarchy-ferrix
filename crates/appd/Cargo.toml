[package]
name = "appd"
description = "Application service: loads the app catalog, launches and supervises every application as an isolated process through a runtime adapter, associates compositor surfaces with instances, and serves the app-protocol socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
app-api = { path = "../app-api" }
app-protocol = { path = "../app-protocol" }
app-runtime-api = { path = "../app-runtime-api" }
# Composed in `src/main.rs` only; the library never names a runtime implementation.
runtime-native = { path = "../runtime-native" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["net"] }

[lints]
workspace = true
