[package]
name = "ferrix-networkd"
description = "Privileged networking service: owns Wi-Fi/connectivity state through a backend adapter, authorizes clients by verified AppId and capability, and serves ferrix-network-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# NetworkManager adapter (Linux, D-Bus). Composed in `src/main.rs` only.
production = ["ferrix-network-nm", "ferrix-network-nm/production"]

[dependencies]
ferrix-mock-control = { path = "../ferrix-mock-control" }
ferrix-network-adapter-api = { path = "../ferrix-network-adapter-api" }
ferrix-network-api = { path = "../ferrix-network-api" }
ferrix-network-protocol = { path = "../ferrix-network-protocol" }
# Backends are composed in `src/main.rs` only; the library never names one.
ferrix-network-mock = { path = "../ferrix-network-mock" }
ferrix-network-nm = { path = "../ferrix-network-nm", optional = true }
ferrix-target-profile = { path = "../ferrix-target-profile" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["net"] }

[lints]
workspace = true
