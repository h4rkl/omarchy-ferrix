[package]
name = "ferrix-network-api"
description = "Stable, target-neutral networking contract: adapters, radio state, scans, access points, profiles, IP configuration, connectivity, captive portal, typed errors and events"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
