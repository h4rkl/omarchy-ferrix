[package]
name = "ferrix-runtime-native"
description = "Native application runtime: launches applications as supervised Linux processes in their own namespaces through the ferrix-sandbox supervisor"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ferrix-app-api = { path = "../ferrix-app-api" }
ferrix-app-runtime-api = { path = "../ferrix-app-runtime-api" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# Signal delivery for `terminate` works on every Unix host (macOS host tests
# included); the namespace, mount, and hostname APIs are Linux only. Cargo
# unifies the feature sets when both tables apply.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["process", "thread", "mount", "system", "fs", "net"] }
signal-hook = "0.4"
# seccomp-bpf filter compiler (rust-vmm; Apache-2.0 OR BSD-3-Clause, used
# under Apache-2.0). Its only dependency is libc; it does not build on macOS.
seccompiler = { version = "0.5", default-features = false }
# Syscall numbers for the deny list (MIT OR Apache-2.0; already in the tree).
libc = "0.2"

[[bin]]
name = "ferrix-sandbox"
path = "src/bin/ferrix-sandbox.rs"
