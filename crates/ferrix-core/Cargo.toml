[package]
name = "ferrix-core"
description = "Persistent Rust mobile core: owns hardware state via ferrix-hardware-api, serves it to shells over a Unix socket, and accepts typed mock-control commands"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Raises the system `show-bluetooth-pairing` handler (role `service`).
ferrix-app-api = { path = "../ferrix-app-api" }
ferrix-app-protocol = { path = "../ferrix-app-protocol" }
ferrix-hardware-api = { path = "../ferrix-hardware-api" }
ferrix-session = { path = "../ferrix-session" }
ferrix-protocol = { path = "../ferrix-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[lints]
workspace = true

[dev-dependencies]
# Replays the checked-in Bluetooth scenarios in-process (host tool, tests only).
ferrix-scenario = { path = "../ferrix-scenario" }
