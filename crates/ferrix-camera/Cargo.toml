[package]
name = "ferrix-camera"
description = "Omarchy Ferrix Camera: independent software-rendered Wayland camera app over the portable camera capability (app id org.ferrix.camera)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrix-app-api = { path = "../ferrix-app-api" }
ferrix-app-protocol = { path = "../ferrix-app-protocol" }
ferrix-hardware-api = { path = "../ferrix-hardware-api" }
# The camera socket client (ADR-009); no adapter is named.
ferrix-protocol = { path = "../ferrix-protocol" }
ferrix-ui = { path = "../ferrix-ui" }
# Still file names in the session's local zone: the same time-zone stack
# ferrix-ui's status clock and Files use.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Lossless still encoding (MIT/Apache-2.0), already in the workspace lock.
png = "0.17"

[lints]
workspace = true
