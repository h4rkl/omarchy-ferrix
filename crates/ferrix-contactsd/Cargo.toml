[package]
name = "ferrix-contactsd"
description = "Contacts service: versioned atomic persistent store with migrations and vCard export/import; authorizes clients by verified AppId and capability"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrix-contacts-api = { path = "../ferrix-contacts-api" }
ferrix-contacts-protocol = { path = "../ferrix-contacts-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["net"] }

[lints]
workspace = true
