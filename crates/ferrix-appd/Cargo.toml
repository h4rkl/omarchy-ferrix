[package]
name = "ferrix-appd"
description = "Application service: loads the app catalog, launches and supervises every application as an isolated process through a runtime adapter, associates compositor surfaces with instances, and serves the ferrix-app-protocol socket"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferrix-app-api = { path = "../ferrix-app-api" }
ferrix-app-protocol = { path = "../ferrix-app-protocol" }
ferrix-app-runtime-api = { path = "../ferrix-app-runtime-api" }
# Composed in `src/main.rs` only; the library never names a runtime implementation.
ferrix-runtime-native = { path = "../ferrix-runtime-native" }
ferrix-runtime-android = { path = "../ferrix-runtime-android" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["net"] }

[lints]
workspace = true
