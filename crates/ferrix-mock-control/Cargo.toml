[package]
name = "ferrix-mock-control"
description = "Host/test-only mock-control channel shared by mocked service adapters: line-delimited JSON over a virtio-serial port or Unix socket; never a product interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

