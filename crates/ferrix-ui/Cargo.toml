[package]
name = "ferrix-ui"
description = "Omarchy Ferrix software-rendering toolkit shared by the reference surfaces: canvas, type, Ferrix theme (colors.toml), touch keyboard, keymap, and the fullscreen Wayland client runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fontdue = "0.9"
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
