[package]
name = "ferrix-ui"
description = "Omarchy Ferrix software-rendering toolkit shared by the reference surfaces: canvas, shaped IBM Plex and Noto text, Ferrix theme (colors.toml), touch keyboard, keymap, and the fullscreen Wayland client runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Text shaping (HarfRust), bidi, Noto fallback and layout; `swash` rasterises
# glyphs on the CPU. No fontconfig: guest font directories are scanned
# directly (src/text.rs).
cosmic-text = { version = "0.19", default-features = false, features = ["std", "swash"] }
# Local wall clock: honours TZ (POSIX or IANA names via the system zoneinfo)
# and /etc/localtime in pure Rust; see src/clock.rs for why.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.12"
unicode-script = "0.5"
unicode-segmentation = "1"
toml = { version = "1.1", default-features = false, features = ["std", "parse", "serde"] }

# Build-time only: compile the pinned Material Symbols SVG subset into outline data
# (see build.rs). Neither crate is linked into any binary.
[build-dependencies]
sha2 = "0.10"
usvg = { version = "0.48", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop"] }
