[package]
name = "ferrix-ui"
description = "Omarchy Ferrix software-rendering toolkit shared by the reference surfaces: canvas, type, Ferrix theme (colors.toml), touch keyboard, keymap, and the fullscreen Wayland client runner"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
fontdue = "0.9"
# Local wall clock: honours TZ (POSIX or IANA names via the system zoneinfo)
# and /etc/localtime in pure Rust; see src/clock.rs for why.
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
serde = { version = "1", features = ["derive"] }
tiny-skia = "0.11"
toml = { version = "0.8", default-features = false, features = ["parse"] }

# Build-time only: compile the pinned Material Symbols SVG subset into outline data
# (see build.rs). Neither crate is linked into any binary.
[build-dependencies]
sha2 = "0.10"
usvg = { version = "0.48", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
